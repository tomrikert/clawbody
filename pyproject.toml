[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawbodylocal"
version = "0.2.1"
description = "Asmo's local OpenClaw body for Reachy Mini, with local STT, pluggable TTS, and expressive movement."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Asmo", email = "stanme@asmo.bot"}
]
keywords = [
    "clawbodylocal",
    "clawbody",
    "reachy-mini",
    "openclaw",
    "clawson",
    "robotics",
    "ai-assistant",
    "local-speech",
    "voice-conversation",
    "expressive-robot",
    "embodied-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    # Optional OpenAI client retained for the cloud vision fallback
    "openai>=1.50.0",

    # Local speech provider clients
    "httpx>=0.27.0",
    
    # Audio processing
    "numpy",
    "scipy",
    "pillow>=10",
    # Native apps share Reachy's apps venv. Pin the validated SDK in the main
    # dependency set so installing the dance library cannot downgrade it.
    "reachy-mini==1.9.0",
    "reachy-mini-dances-library>=0.2.1",
    
    # OpenClaw gateway client (WebSocket protocol)
    "websockets>=12.0",
    
    # Gradio UI
    "gradio>=4.0.0",
    
    # Environment
    "python-dotenv",
]

[project.optional-dependencies]
robot = [
    "reachy-mini==1.9.0",
]
wireless = [
    "pygobject",
]
# YOLO-based face tracking (recommended - more accurate)
yolo_vision = [
    "opencv-python",
    "ultralytics",
    "supervision",
]
# MediaPipe-based face tracking (lighter weight alternative)
mediapipe_vision = [
    "mediapipe>=0.10.14",
]
# All vision options
all_vision = [
    "opencv-python",
    "ultralytics",
    "supervision",
    "mediapipe>=0.10.14",
]
# Legacy alias
vision = [
    "opencv-python",
    "ultralytics",
    "supervision",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.scripts]
clawbodylocal = "reachy_mini_openclaw.main:main"
# Compatibility alias for existing local launchers and operator muscle memory.
clawbody = "reachy_mini_openclaw.main:main"

[project.entry-points."reachy_mini_apps"]
clawbodylocal = "reachy_mini_openclaw.main:ReachyMiniOpenclaw"

[project.urls]
Homepage = "https://huggingface.co/spaces/asmolebot/clawbodylocal"
Documentation = "https://github.com/asmolebot/clawbody#readme"
Repository = "https://github.com/asmolebot/clawbody"
Issues = "https://github.com/asmolebot/clawbody/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
